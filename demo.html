<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pro Photo — Курс</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="demo.css">
</head>
<body>
  <div id="bootLoader" class="boot-loader">
    <div class="boot-card">
      <p class="boot-label">Загрузка данных</p>
      <h2>Проверяем доступ к курсу</h2>
      <div class="progress-track">
        <div id="bootBar" class="progress-fill"></div>
      </div>
      <p id="bootStatus">Подключение к таблице...</p>
    </div>
  </div>

  <div id="deniedScreen" class="state-screen hidden">
    <div class="state-card">
      <h2>Нет доступа</h2>
      <p id="deniedText">Нет доступа, обратитесь в поддержку.</p>
      <a href="https://t.me/das8ash" target="_blank" rel="noopener noreferrer">Написать в поддержку</a>
    </div>
  </div>

  <div id="app" class="app hidden">
    <header class="topbar">
      <div>
        <p class="meta-label">Обучающая платформа</p>
        <h1 id="courseTitle">Pro Photo</h1>
      </div>

      <div class="topbar-right">
        <div class="platform-pill">ID: <span id="platformIdLabel">—</span></div>
        <div class="progress-box">
          <div class="progress-box-head">
            <span>Пройдено</span>
            <strong id="globalProgressText">0%</strong>
          </div>
          <div class="progress-track small">
            <div id="globalProgressBar" class="progress-fill"></div>
          </div>
        </div>
      </div>
    </header>

    <main class="app-layout">
      <aside class="sections-panel">
        <h3>Разделы</h3>
        <nav id="sectionList" class="section-list"></nav>
      </aside>

      <section class="workspace">
        <div class="workspace-head">
          <h3 id="activeSectionTitle">Учебный режим</h3>
          <p id="activeSectionSubtitle"></p>
        </div>
        <div id="postFeed" class="post-feed"></div>
      </section>
    </main>
  </div>

  <div id="photoModal" class="photo-modal hidden">
    <button id="closeModalBtn" class="modal-close" type="button">×</button>
    <button id="modalPrevBtn" class="modal-nav modal-nav-prev" type="button" aria-label="Предыдущее фото">‹</button>
    <div class="photo-modal-stage">
      <img id="modalImage" src="" alt="Фото">
      <div id="modalCounter" class="modal-counter">1 / 1</div>
    </div>
    <button id="modalNextBtn" class="modal-nav modal-nav-next" type="button" aria-label="Следующее фото">›</button>
  </div>

  <script src="course-data.js"></script>
  <script src="demo-config.js"></script>
  <script src="demo.js"></script>
</body>
</html>
